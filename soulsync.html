<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SoulSync — Vibe Check</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f111a">
    
    <!-- Engine -->
    <script src="companion.js"></script>
    <script src="juice.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then((registration) => {
                registration.onupdatefound = () => {
                    const installingWorker = registration.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            }).catch((error) => console.error('SW registration failed:', error));
        }
    </script>
</head>
<body id="body-bg">

    <!-- Particle Canvas for the Submit Effect -->
    <canvas id="particle-canvas"></canvas>

    <div class="top-bar">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="title-text">SOULSYNC</div>
        <div style="width: 20px;"></div>
    </div>

    <div class="soul-container">
        
        <div class="mood-display">
            <div class="glow-orb" id="glow-orb"></div>
            <div class="mood-emoji" id="mood-emoji">🙂</div>
            <div class="mood-label" id="mood-label">Content</div>
        </div>

        <div class="mood-slider">
            <button class="mood-btn" data-mood="1" data-color="#1a1a2e" data-emoji="😔">😔</button>
            <button class="mood-btn" data-mood="2" data-color="#1a1a24" data-emoji="😐">😐</button>
            <button class="mood-btn active" data-mood="3" data-color="#1e2a38" data-emoji="🙂">🙂</button>
            <button class="mood-btn" data-mood="4" data-color="#2a1e38" data-emoji="😄">😄</button>
            <button class="mood-btn" data-mood="5" data-color="#382a1e" data-emoji="🤩">🤩</button>
        </div>

        <div class="reflection-card">
            <textarea id="reflection" placeholder="Write a quick reflection (optional)..."></textarea>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitSoul()">Release Thought</button>
    </div>

    <div class="success-overlay" id="success-overlay">
        <div class="success-icon"><i class="fa-solid fa-check"></i></div>
        <h2>Thought Released</h2>
        <p id="success-xp">+20 XP · +3 Mood</p>
    </div>

    <script>
        let selectedMood = 3;
        let currentColor = '#1e2a38';
        const body = document.getElementById('body-bg');
        const orb = document.getElementById('glow-orb');
        const emojiDisplay = document.getElementById('mood-emoji');
        const labelDisplay = document.getElementById('mood-label');
        const mButtons = document.querySelectorAll('.mood-btn');

        const moodLabels = { 1: 'Low', 2: 'Okay', 3: 'Content', 4: 'Great', 5: 'Amazing' };
        const orbColors = { 1: '#78829e', 2: '#8ec8e8', 3: '#7fd8ff', 4: '#a8e8ff', 5: '#ffd700' };

        // Initial setup
        body.style.background = currentColor;

        mButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Update UI
                mButtons.forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                
                selectedMood = parseInt(e.currentTarget.dataset.mood);
                currentColor = e.currentTarget.dataset.color;
                
                // Update Text & Emoji
                emojiDisplay.textContent = e.currentTarget.dataset.emoji;
                labelDisplay.textContent = moodLabels[selectedMood];
                
                // Update Background & Orb
                body.style.background = `radial-gradient(circle at center, ${currentColor} 0%, #0f111a 100%)`;
                orb.style.background = `radial-gradient(circle, ${orbColors[selectedMood]} 0%, transparent 70%)`;
                orb.style.boxShadow = `0 0 60px ${orbColors[selectedMood]}`;
                
                // Haptics
                if (window.Juice) Juice.vibrate(20);
            });
        });

        // --- Particle System for Submit ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 1) * 8 - 2; // Fly upwards
                this.size = Math.random() * 4 + 1;
                this.color = color;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- Submit Logic ---
        function submitSoul() {
            const text = document.getElementById('reflection').value.trim();
            const btn = document.getElementById('submit-btn');
            
            // Disable button to prevent double submit
            btn.style.pointerEvents = 'none';
            btn.textContent = 'Releasing...';

            // Trigger Particle Burst
            const rect = btn.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top;

            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(startX, startY, orbColors[selectedMood]));
            }

            // Emit to Companion Engine
            if (window.Companion) {
                // 1. Mood Check-in
                Companion.emit({
                    id: crypto.randomUUID(),
                    type: 'MOOD_CHECKIN',
                    payload: { value: selectedMood }
                });

                // 2. Reflection (if typed)
                if (text.length > 0) {
                    Companion.emit({
                        id: crypto.randomUUID(),
                        type: 'REFLECTION_WRITTEN',
                        payload: { text: text }
                    });
                }
            }

            // Juice
            if (window.Juice) {
                Juice.playPetSound();
                Juice.vibrate([50, 50, 50]);
            }

            // Show Success Overlay
            const xpText = text.length > 0 ? '+70 XP · +3 Mood' : '+20 XP';
            document.getElementById('success-xp').textContent = xpText;
            document.getElementById('success-overlay').classList.add('active');

            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }
    </script>
</body>
</html>
