<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SoulSync — Vitverse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f111a">
    <script src="companion.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then((registration) => {
                registration.onupdatefound = () => {
                    const installingWorker = registration.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            }).catch((error) => console.error('SW registration failed:', error));
        }
    </script>
    <style>
        body { transition: background 0.8s ease; background: #0f111a; }
        .logo-link { display: inline-block; margin-top: 20px; margin-bottom: 20px; cursor: pointer; transition: transform 0.2s ease; }
        .logo-link:active { transform: scale(0.95); }
        .logo-image { width: 160px; height: auto; display: block; }
        
        .soul-card {
            background: var(--bg-surface); border: 1px solid var(--border-glass);
            border-radius: 24px; padding: 30px; width: 100%; max-width: 400px;
            backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 { color: var(--accent); margin-top: 0; font-size: 20px; font-family: var(--font-display); letter-spacing: 1px;}
        
        .mood-grid { display: flex; justify-content: center; gap: 15px; margin: 20px 0 30px 0; }
        .mood-btn {
            background: rgba(0,0,0,0.3); border: 1px solid transparent; border-radius: 50%; width: 60px; height: 60px;
            font-size: 30px; cursor: pointer; transition: all 0.2s ease; opacity: 0.5;
        }
        .mood-btn.selected { opacity: 1; border-color: var(--accent); background: rgba(0, 229, 255, 0.1); transform: scale(1.1); box-shadow: 0 0 15px var(--accent-glow); }
        
        textarea {
            width: 100%; height: 100px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 15px; color: var(--text-main); font-family: var(--font-ui);
            resize: none; margin-bottom: 20px; outline: none; transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--accent); }
        
        .save-btn {
            background: var(--accent); color: #000; border: none; padding: 15px 40px; border-radius: 16px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
            box-shadow: 0 0 15px var(--accent-glow); transition: transform 0.2s ease;
        }
        .save-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="wrapper" style="align-items: center;">
        <a href="index.html" class="logo-link"><img src="logo.png" alt="VITVERSE" class="logo-image"></a>
        
        <div class="soul-card">
            <h2>✨ SoulSync</h2>
            <p style="color: var(--text-muted); font-size: 14px;">How is your soul feeling?</p>
            
            <div class="mood-grid" id="mood-grid">
                <button type="button" class="mood-btn" data-m="1">😔</button>
                <button type="button" class="mood-btn" data-m="2">😐</button>
                <button type="button" class="mood-btn" data-m="3">🙂</button>
                <button type="button" class="mood-btn" data-m="4">😄</button>
                <button type="button" class="mood-btn" data-m="5">🤩</button>
            </div>
            
            <textarea id="reflection" placeholder="Write a quick reflection (optional)..."></textarea>
            <button type="button" class="save-btn" onclick="saveSoul()">Save Check-in</button>
        </div>
    </div>

    <script>
        let selectedMood = 3;
        const mButtons = document.querySelectorAll('.mood-btn');
        const body = document.body;

        const themes = {
            1: 'radial-gradient(circle at center, #1a1a2e 0%, #0f111a 100%)',
            2: 'radial-gradient(circle at center, #1a1a24 0%, #0f111a 100%)',
            3: 'radial-gradient(circle at center, #1e2a38 0%, #0f111a 100%)',
            4: 'radial-gradient(circle at center, #2a1e38 0%, #0f111a 100%)',
            5: 'radial-gradient(circle at center, #382a1e 0%, #0f111a 100%)'
        };

        mButtons.forEach(btn => {
            if (btn.dataset.m == selectedMood) btn.classList.add('selected');
            btn.addEventListener('click', () => {
                mButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedMood = parseInt(btn.dataset.m);
                body.style.background = themes[selectedMood];
            });
        });

        function saveSoul() {
            const text = document.getElementById('reflection').value.trim();
            if (window.Companion) {
                Companion.emit({ id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString() + '-m', type: 'MOOD_CHECKIN', payload: { value: selectedMood } });
                if (text.length > 0) {
                    Companion.emit({ id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString() + '-r', type: 'REFLECTION_WRITTEN', payload: { text: text } });
                }
            }
            const btn = document.querySelector('.save-btn');
            btn.textContent = 'Saved! Returning...';
            btn.style.background = '#4ade80';
            setTimeout(() => window.location.href = 'index.html', 1000);
        }
    </script>
</body>
</html>
