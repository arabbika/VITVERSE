<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitverse — Real-Life RPG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="companion.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        /* UI Enhancements */
        .hud-container { width: 100%; max-width: 320px; margin: 10px auto; text-align: center; }
        .level-badge {
            display: inline-block; background: #00bfff; color: #000; font-weight: bold; 
            padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 5px;
        }
        .xp-bar-bg { width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden; box-shadow: inset 2px 2px 4px #111; }
        .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #00bfff, #a8e8ff); width: 0%; transition: width 0.5s ease; }
        .xp-text { font-size: 10px; color: #888; margin-top: 4px; font-family: monospace; }
        
        .quest-bubble {
            cursor: pointer; transition: transform 0.2s ease, background 0.2s ease;
            border: 1px solid #00bfff; box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
        }
        .quest-bubble:hover { transform: scale(1.02); background: rgba(0, 191, 255, 0.2); }
        .quest-action { font-size: 12px; font-weight: bold; color: #fff; margin-top: 8px; text-transform: uppercase; }

        /* Inventory Tabs */
        .inv-tabs { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .inv-tab {
            background: #222; border: none; padding: 5px 15px; border-radius: 15px;
            color: #888; font-size: 12px; cursor: pointer; box-shadow: 2px 2px 5px #111;
        }
        .inv-tab.active { background: #00bfff; color: #000; font-weight: bold; }
        
        .inventory-container { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; max-width: 320px;}
        .inv-item {
            width: 40px; height: 40px; background: #222; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            box-shadow: inset 3px 3px 6px #111, inset -3px -3px 6px #333;
            cursor: pointer; transition: transform 0.2s; position: relative;
        }
        .inv-item:hover { transform: scale(1.1); }
        .inv-item.equipped { border: 2px solid #00bfff; }
        .inv-item.empty { opacity: 0.3; cursor: default; }
        .inv-item .check { position: absolute; bottom: -2px; right: -2px; font-size: 12px; background: #00bfff; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; color: #000; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="top-buttons">
                <button type="button" class="neumorphic-button" onclick="navigateToPage('breathewell.html')"><i class="fa-solid fa-wind"></i><span>Focus</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('chronozen.html')"><i class="fa-solid fa-calendar"></i><span>Quests</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('dreamweaver.html')"><i class="fa-solid fa-lightbulb"></i><span>Camp</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('soulsync.html')"><i class="fa-solid fa-heart"></i><span>Spirit</span></button>
            </div>
        </header>

        <div style="display:flex; flex-direction:column; align-items:center; margin: 10px 0;">
            <!-- Quest Speech Bubble -->
            <div id="companion-memory" class="companion-memory quest-bubble" onclick="gotoQuest()">
                Loading quest log...
            </div>
            
            <!-- THE SANCTUARY (Empire Building) -->
            <div class="sanctuary-stage" id="sanctuary">
                <!-- Decor Items (Hidden by CSS until equipped) -->
                <svg class="decor decor-plant" style="bottom: 10px; left: 20px; width: 60px; height: 80px;" viewBox="0 0 60 80">
                    <path d="M 30 80 L 30 40" stroke="#2e7d32" stroke-width="4"/>
                    <circle cx="30" cy="40" r="20" fill="#4caf50" opacity="0.8"/>
                    <circle cx="15" cy="50" r="12" fill="#388e3c" opacity="0.8"/>
                    <circle cx="45" cy="50" r="12" fill="#388e3c" opacity="0.8"/>
                </svg>

                <svg class="decor decor-lamp" style="top: 10px; right: 20px; width: 40px; height: 60px;" viewBox="0 0 40 60">
                    <rect x="15" y="20" width="10" height="40" fill="#555"/>
                    <path d="M 5 20 L 35 20 L 25 0 L 15 0 Z" fill="#ffd54f"/>
                    <circle cx="20" cy="20" r="30" fill="#ffd54f" opacity="0.1"/>
                </svg>

                <svg class="decor decor-rug" style="bottom: 0; width: 100%; height: 40px;" viewBox="0 0 300 40">
                    <ellipse cx="150" cy="20" rx="140" ry="15" fill="#d32f2f" opacity="0.6"/>
                    <ellipse cx="150" cy="20" rx="120" ry="10" fill="#b71c1c" opacity="0.6"/>
                </svg>

                <!-- The Companion -->
                <svg class="companion" id="companion" onclick="petCompanion()" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="cursor: pointer;">
                    <defs>
                        <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="var(--body-inner)"/>
                            <stop offset="100%" stop-color="var(--body-outer)"/>
                        </radialGradient>
                    </defs>
                    <g class="bob-group">
                        <!-- Wearables -->
                        <ellipse class="cosmetic halo" cx="100" cy="42" rx="35" ry="10" fill="none" stroke="#ffd700" stroke-width="4" opacity="0.8" />
                        <path class="cosmetic sprout" d="M 100 58 Q 95 40 80 45 Q 95 50 100 58 Z" fill="#4ade80" />
                        <path class="cosmetic sprout" d="M 100 58 Q 105 40 120 45 Q 105 50 100 58 Z" fill="#22c55e" />
                        <path class="cosmetic scarf" d="M 50 140 Q 100 160 150 140 L 150 155 Q 100 175 50 155 Z" fill="#ef4444" />
                        <path class="cosmetic scarf" d="M 135 145 L 145 180 L 130 180 Z" fill="#dc2626" />
                        <path class="cosmetic crown" d="M 75 55 L 85 25 L 100 45 L 115 25 L 125 55 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2" stroke-linejoin="round" />
                        
                        <g class="breath-group">
                            <path class="body" d="M 100 175 C 35 175, 25 110, 45 70 C 65 35, 135 35, 155 70 C 175 110, 165 175, 100 175 Z" fill="url(#bodyGrad)"/>
                            <g class="face">
                                <ellipse class="eye" cx="80" cy="105" rx="7" ry="10" fill="#1a1a2e"/>
                                <ellipse class="eye" cx="120" cy="105" rx="7" ry="10" fill="#1a1a2e"/>
                                <circle cx="78" cy="102" r="2.5" fill="#fff" opacity="0.8"/>
                                <circle cx="118" cy="102" r="2.5" fill="#fff" opacity="0.8"/>
                                <path class="mouth mouth-radiant" d="M 82 128 Q 100 145 118 128" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-content" d="M 85 130 Q 100 138 115 130" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-settled" d="M 88 132 L 112 132" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-quiet" d="M 88 133 Q 100 131 112 133" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-low" d="M 85 137 Q 100 127 115 137" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                            </g>
                            <g class="cheeks">
                                <circle cx="66" cy="120" r="7" fill="#ff8fb8" opacity="0.6"/>
                                <circle cx="134" cy="120" r="7" fill="#ff8fb8" opacity="0.6"/>
                            </g>
                        </g>
                    </g>
                </svg>
            </div>

            <!-- HUD -->
            <div class="hud-container">
                <div class="level-badge">LEVEL <span id="hud-level">1</span></div>
                <div class="xp-bar-bg"><div id="xp-bar-fill" class="xp-bar-fill"></div></div>
                <div id="xp-text" class="xp-text">0 / 1000 XP</div>
            </div>

            <!-- Guild (Shared Streak) -->
            <div class="guild-card" id="guild-card">
                <!-- Rendered via JS -->
            </div>

            <!-- Inventory -->
            <div class="inv-tabs">
                <button class="inv-tab active" onclick="switchTab('wearables')" id="tab-wearables">Wearables</button>
                <button class="inv-tab" onclick="switchTab('decor')" id="tab-decor">Sanctuary</button>
            </div>
            <div class="inventory-container" id="inventory">
                <!-- Rendered via JS -->
            </div>
        </div>

        <footer>
            <button type="button" class="footer-button" onclick="showChildButtons('wellbeing')" aria-expanded="true">WellBeing</button>
            <button type="button" class="footer-button" onclick="showChildButtons('productivity')" aria-expanded="false">Productivity</button>
            <button type="button" class="footer-button" onclick="showChildButtons('connections')" aria-expanded="false">Connections</button>
            <button type="button" class="footer-button" onclick="showChildButtons('relaxation')" aria-expanded="false">Relaxation</button>
        </footer>
    </div>

    <script src="companion.js"></script>
    <script src="companion-ui.js"></script>
    <script>
        function navigateToPage(page) { window.location.href = page; }
        let currentQuestLink = null;
        let currentInvTab = 'wearables';

        function showChildButtons(category) {
            document.querySelectorAll('.child-buttons').forEach(div => { div.style.display = 'none'; });
        }

        const uuid = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
        function emit(type, payload) { Companion.emit({ id: uuid(), type, payload }); }

        function gotoQuest() { if (currentQuestLink) window.location.href = currentQuestLink; }

        let petsToday = 0;
        function petCompanion() {
            const svg = document.getElementById('companion');
            svg.style.transform = 'scale(0.9) translateY(-20px)';
            setTimeout(() => { svg.style.transform = 'scale(1) translateY(0)'; }, 150);
        }

        function switchTab(tab) {
            currentInvTab = tab;
            document.getElementById('tab-wearables').classList.toggle('active', tab === 'wearables');
            document.getElementById('tab-decor').classList.toggle('active', tab === 'decor');
            updateDashboard(Companion.view());
        }

        function equipWearable(item) {
            if (!item) return;
            Companion.emit({ type: 'EQUIP_WEARABLE', payload: { item: item } });
        }

        function toggleDecor(item) {
            if (!item) return;
            Companion.emit({ type: 'TOGGLE_DECOR', payload: { item: item } });
        }

        function linkGuild() {
            const code = prompt("Enter a Guild Code (or leave blank to generate one):");
            if (code === null) return; // cancelled
            const finalCode = code.trim() || Math.random().toString(36).substring(2, 8).toUpperCase();
            Companion.emit({ type: 'LINK_GUILD', payload: { code: finalCode } });
        }

        function updateDashboard(view) {
            // 1. Update HUD
            document.getElementById('hud-level').textContent = view.level;
            const progress = (view.xp / view.xpNeeded) * 100;
            document.getElementById('xp-bar-fill').style.width = `${progress}%`;
            document.getElementById('xp-text').textContent = `${view.xp} / ${view.xpNeeded} XP`;

            // 2. Update Quest
            if (view.quest) {
                const bubble = document.getElementById('companion-memory');
                bubble.innerHTML = `${view.quest.text}<br><span class="quest-action">👉 ${view.quest.action}</span>`;
                currentQuestLink = view.quest.link;
            }

            // 3. Update Guild Card
            const guildCard = document.getElementById('guild-card');
            if (view.guild && view.guild.code) {
                // Simulate friend activity to show off the mechanic
                const streak = view.guild.sharedStreak + (view.guild.partnerActive ? 1 : 0);
                guildCard.innerHTML = `
                    <div class="guild-title">Guild Linked: <span style="color:#00bfff">${view.guild.code}</span></div>
                    <div class="guild-streak">🔥 ${streak} Day Shared Streak</div>
                    <div style="font-size:10px; color:#888;">Partner Active Today</div>
                `;
            } else {
                guildCard.innerHTML = `
                    <div class="guild-title">Play with a Friend</div>
                    <div style="font-size:11px; color:#888; margin-bottom:10px;">Link accounts to build a shared streak. If one of you fails, the streak breaks!</div>
                    <button class="guild-btn" onclick="linkGuild()">Link / Create Guild</button>
                `;
            }

            // 4. Update Sanctuary Decor
            const sanctuary = document.getElementById('sanctuary');
            const decorStr = view.equipped.decor.join(' ');
            sanctuary.setAttribute('data-decor', decorStr);
            
            // 5. Update Inventory UI
            const invContainer = document.getElementById('inventory');
            invContainer.innerHTML = '';
            
            if (currentInvTab === 'wearables') {
                const items = ['halo', 'sprout', 'scarf', 'crown'];
                items.forEach(item => {
                    const hasItem = view.inventory.wearables.includes(item);
                    const isEquipped = view.equipped.wearable === item;
                    const div = document.createElement('div');
                    const icons = { halo: '😇', sprout: '🌱', scarf: '🧣', crown: '👑' };
                    div.className = `inv-item ${!hasItem ? 'empty' : ''} ${isEquipped ? 'equipped' : ''}`;
                    div.textContent = hasItem ? icons[item] : '?';
                    if (hasItem) div.onclick = () => equipWearable(isEquipped ? null : item);
                    invContainer.appendChild(div);
                });
            } else {
                const items = ['plant', 'lamp', 'rug', 'terminal'];
                items.forEach(item => {
                    const hasItem = view.inventory.decor.includes(item);
                    const isEquipped = view.equipped.decor.includes(item);
                    const div = document.createElement('div');
                    const icons = { plant: '🪴', lamp: '💡', rug: '🧶', terminal: '🖥️' };
                    div.className = `inv-item ${!hasItem ? 'empty' : ''} ${isEquipped ? 'equipped' : ''}`;
                    div.textContent = hasItem ? icons[item] : '?';
                    if (hasItem) div.onclick = () => toggleDecor(item);
                    invContainer.appendChild(div);
                });
            }

            // Update companion wearables attribute
            document.getElementById('companion').setAttribute('data-wearable', view.equipped.wearable || '');
        }

        document.addEventListener('DOMContentLoaded', () => {
            CompanionUI.mount(document.getElementById('companion'));
            updateDashboard(Companion.view());
            window.addEventListener('companion:update', (e) => updateDashboard(e.detail));
        });
    </script>
</body>
</html>
