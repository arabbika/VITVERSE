<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vitverse — Your Inner Sanctuary</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="companion.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f111a">

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then((registration) => {
                registration.onupdatefound = () => {
                    const installingWorker = registration.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            }).catch((error) => console.error('SW registration failed:', error));
        }
    </script>
</head>
<body>
    <!-- DEBUG BANNER: PROVES IF YOU ARE RUNNING THE NEW CODE -->
    <div id="debug-banner" style="position:fixed; top:0; left:0; right:0; background:red; color:white; padding:10px; text-align:center; font-size:16px; font-weight:bold; z-index:99999;">
        LOADING...
    </div>

    <div class="wrapper" style="margin-top: 50px;">
        <header>
            <div class="top-buttons">
                <button type="button" class="neumorphic-button" onclick="navigateToPage('breathewell.html')"><i class="fa-solid fa-wind"></i><span>Focus</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('chronozen.html')"><i class="fa-solid fa-calendar"></i><span>Quests</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('dreamweaver.html')"><i class="fa-solid fa-lightbulb"></i><span>Camp</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('soulsync.html')"><i class="fa-solid fa-heart"></i><span>Spirit</span></button>
            </div>
        </header>

        <main style="display:flex; flex-direction:column; gap:16px; padding-bottom:40px;">
            
            <div id="companion-memory" class="companion-memory">
                <span>Welcome back. What's on your mind?</span>
            </div>
            
            <div class="sanctuary-stage" id="sanctuary">
                
                <a href="zen.html" id="zen-rock" class="zen-rock" title="Enter Zen Sandbox">🪨</a>
                <div id="zen-lock-msg" class="zen-lock-msg" style="display:none;">Companion needs rest. Zen unlocked.</div>

                <button id="audio-btn" class="audio-toggle-btn" onclick="SanctuaryAudio.toggle(Companion.view().dominantStat)">
                    <i class="fa-solid fa-volume-xmark"></i>
                </button>

                <div class="aura-ring"></div>
                
                <svg class="companion" id="companion" onclick="petCompanion()" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="var(--body-inner)"/>
                            <stop offset="100%" stop-color="var(--body-outer)"/>
                        </radialGradient>
                    </defs>
                    <g class="bob-group">
                        <g class="breath-group">
                            <path class="body" d="M 100 175 C 35 175, 25 110, 45 70 C 65 35, 135 35, 155 70 C 175 110, 165 175, 100 175 Z" fill="url(#bodyGrad)"/>
                            <g class="face">
                                <ellipse class="eye" cx="80" cy="105" rx="7" ry="10" fill="#1a1a2e"/>
                                <ellipse class="eye" cx="120" cy="105" rx="7" ry="10" fill="#1a1a2e"/>
                                <circle cx="78" cy="102" r="2.5" fill="#fff" opacity="0.9"/>
                                <circle cx="118" cy="102" r="2.5" fill="#fff" opacity="0.9"/>
                                <path class="mouth mouth-radiant" d="M 82 128 Q 100 145 118 128" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-content" d="M 85 130 Q 100 138 115 130" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-settled" d="M 88 132 L 112 132" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-quiet" d="M 88 133 Q 100 131 112 133" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-low" d="M 85 137 Q 100 127 115 137" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                            </g>
                            <g class="cheeks">
                                <circle cx="66" cy="120" r="7" fill="#ff8fb8" opacity="0.5"/>
                                <circle cx="134" cy="120" r="7" fill="#ff8fb8" opacity="0.5"/>
                            </g>
                        </g>
                    </g>
                </svg>
            </div>

            <div class="ai-chat-wrapper">
                <div class="ai-chat-container">
                    <input type="text" id="ai-input" class="ai-input" placeholder="Brain dump or vent here..." onkeypress="if(event.key === 'Enter') window.AILogger.processText(this.value)">
                    <button type="button" class="ai-mic-btn" id="ai-mic-btn" onclick="window.AILogger.toggleMic()"><i class="fa-solid fa-microphone"></i></button>
                    <button type="button" class="ai-mic-btn" style="color:#000; background:var(--accent);" onclick="window.AILogger.processText(document.getElementById('ai-input').value)"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- HUD -->
            <div class="hud-container">
                <div class="hud-top">
                    <div class="level-text">LEVEL <span id="hud-level">1</span></div>
                    <div class="xp-text" id="xp-text">0 / 1000 XP</div>
                </div>
                <div class="xp-bar-bg">
                    <div id="xp-bar-fill" class="xp-bar-fill"></div>
                </div>
                <button class="share-btn" onclick="shareProgress()">
                    <i class="fa-solid fa-share-nodes"></i> Share Sanctuary
                </button>
            </div>

        </main>
    </div>

    <script src="companion.js"></script>
    <script src="companion-ui.js"></script>
    <script src="juice.js"></script>
    <script src="ai-logger.js"></script>
    <script src="audio.js"></script>
    <script src="cloud.js"></script>
    
    <script>
        console.log("VITVERSE V6.0 LOADED");

        function forceUpdateUI() {
            try {
                if (typeof Companion === 'undefined') return;
                
                const s = Companion.get();
                const levelEl = document.getElementById('hud-level');
                const xpTextEl = document.getElementById('xp-text');
                const xpBarEl = document.getElementById('xp-bar-fill');
                const debugBanner = document.getElementById('debug-banner');

                if (levelEl) levelEl.textContent = s.level || 1;
                if (xpTextEl) xpTextEl.textContent = `${s.xp || 0} / ${(s.level || 1) * 1000} XP`;
                if (xpBarEl) xpBarEl.style.width = `${((s.xp || 0) / ((s.level || 1) * 1000)) * 100}%`;
                
                if (debugBanner) {
                    debugBanner.textContent = `ENGINE XP: ${s.xp || 0} | DOM XP: ${xpTextEl ? xpTextEl.textContent : 'NOT FOUND'}`;
                }
            } catch (e) {
                console.error("UI Update Error:", e);
            }
        }

        // Run every 1 second
        setInterval(forceUpdateUI, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            forceUpdateUI(); 
            if (window.posthog) window.posthog.capture('first_open');
            CompanionUI.mount(document.getElementById('companion'));
        });
    </script>
</body>
</html>
