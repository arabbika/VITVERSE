<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vitverse — Your Inner Sanctuary</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="companion.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f111a">
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then((registration) => {
                registration.onupdatefound = () => {
                    const installingWorker = registration.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            }).catch((error) => console.error('SW registration failed:', error));
        }
    </script>

    <style>
        /* Zen Rock Entry Point */
        .zen-rock {
            position: absolute;
            bottom: 15%;
            left: 15%;
            z-index: 20;
            font-size: 36px;
            text-decoration: none;
            filter: drop-shadow(0 0 15px var(--accent));
            animation: float-rock 4s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .zen-rock:active { transform: scale(0.9); }
        
        @keyframes float-rock {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="top-buttons">
                <button type="button" class="neumorphic-button" onclick="navigateToPage('breathewell.html')"><i class="fa-solid fa-wind"></i><span>Focus</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('chronozen.html')"><i class="fa-solid fa-calendar"></i><span>Quests</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('dreamweaver.html')"><i class="fa-solid fa-lightbulb"></i><span>Camp</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('soulsync.html')"><i class="fa-solid fa-heart"></i><span>Spirit</span></button>
            </div>
        </header>

        <main style="display:flex; flex-direction:column; gap:16px; padding-bottom:40px;">
            
            <!-- Memory / Quest Speech Bubble -->
            <div id="companion-memory" class="companion-memory" onclick="gotoQuest()">
                <span>Welcome back. What's on your mind?</span>
            </div>
            
            <!-- THE SANCTUARY -->
            <div class="sanctuary-stage" id="sanctuary">
                
                <!-- Zen Sandbox Entry (The Glowing Rock) -->
                <a href="zen.html" class="zen-rock" title="Enter Zen Sandbox">🪨</a>

                <!-- Audio Toggle Button -->
                <button id="audio-btn" class="audio-toggle-btn" onclick="SanctuaryAudio.toggle(Companion.view().dominantStat)" aria-label="Toggle Ambient Sound">
                    <i class="fa-solid fa-volume-xmark"></i>
                </button>

                <!-- Dynamic Aura Ring -->
                <div class="aura-ring"></div>
                
                <!-- Decor Items -->
                <svg class="decor decor-plant" style="bottom: 10%; left: 10%; width: 60px; height: 80px;" viewBox="0 0 60 80">
                    <path d="M 30 80 L 30 40" stroke="#2e7d32" stroke-width="4"/>
                    <circle cx="30" cy="40" r="20" fill="#4caf50" opacity="0.8"/>
                    <circle cx="15" cy="50" r="12" fill="#388e3c" opacity="0.8"/>
                    <circle cx="45" cy="50" r="12" fill="#388e3c" opacity="0.8"/>
                </svg>
                <svg class="decor decor-lamp" style="top: 10%; right: 10%; width: 50px; height: 70px;" viewBox="0 0 40 60">
                    <rect x="15" y="20" width="10" height="40" fill="#555"/>
                    <path d="M 5 20 L 35 20 L 25 0 L 15 0 Z" fill="#ffd54f"/>
                    <circle cx="20" cy="20" r="30" fill="#ffd54f" opacity="0.15"/>
                </svg>
                <svg class="decor decor-rug" style="bottom: 0; width: 100%; height: 40px;" viewBox="0 0 300 40">
                    <ellipse cx="150" cy="20" rx="140" ry="15" fill="#d32f2f" opacity="0.4"/>
                    <ellipse cx="150" cy="20" rx="120" ry="10" fill="#b71c1c" opacity="0.6"/>
                </svg>

                <!-- The Companion -->
                <svg class="companion" id="companion" onclick="petCompanion()" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="var(--body-inner)"/>
                            <stop offset="100%" stop-color="var(--body-outer)"/>
                        </radialGradient>
                    </defs>
                    <g class="bob-group">
                        <ellipse class="cosmetic halo" cx="100" cy="42" rx="35" ry="10" fill="none" stroke="#ffd700" stroke-width="4" opacity="0.8" />
                        <path class="cosmetic sprout" d="M 100 58 Q 95 40 80 45 Q 95 50 100 58 Z" fill="#4ade80" />
                        <path class="cosmetic sprout" d="M 100 58 Q 105 40 120 45 Q 105 50 100 58 Z" fill="#22c55e" />
                        <path class="cosmetic scarf" d="M 50 140 Q 100 160 150 140 L 150 155 Q 100 175 50 155 Z" fill="#ef4444" />
                        <path class="cosmetic scarf" d="M 135 145 L 145 180 L 130 180 Z" fill="#dc2626" />
                        <path class="cosmetic crown" d="M 75 55 L 85 25 L 100 45 L 115 25 L 125 55 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2" stroke-linejoin="round" />
                        
                        <g class="breath-group">
                            <path class="body" d="M 100 175 C 35 175, 25 110, 45 70 C 65 35, 135 35, 155 70 C 175 110, 165 175, 100 175 Z" fill="url(#bodyGrad)"/>
                            <g class="face">
                                <ellipse class="eye" cx="80" cy="105" rx="7" ry="10" fill="#1a1a2e"/>
                                <ellipse class="eye" cx="120" cy="105" rx="7" ry="10" fill="#1a1a2e"/>
                                <circle cx="78" cy="102" r="2.5" fill="#fff" opacity="0.9"/>
                                <circle cx="118" cy="102" r="2.5" fill="#fff" opacity="0.9"/>
                                <path class="mouth mouth-radiant" d="M 82 128 Q 100 145 118 128" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-content" d="M 85 130 Q 100 138 115 130" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-settled" d="M 88 132 L 112 132" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-quiet" d="M 88 133 Q 100 131 112 133" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-low" d="M 85 137 Q 100 127 115 137" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                            </g>
                            <g class="cheeks">
                                <circle cx="66" cy="120" r="7" fill="#ff8fb8" opacity="0.5"/>
                                <circle cx="134" cy="120" r="7" fill="#ff8fb8" opacity="0.5"/>
                            </g>
                        </g>
                    </g>
                </svg>
            </div>

            <!-- AI Chat Bar -->
            <div class="ai-chat-wrapper">
                <div class="mode-toggles">
                    <button id="mode-tactician" class="mode-btn active" onclick="AILogger.setMode('aura')">
                        <i class="fa-solid fa-shield-halved"></i> Tactician
                    </button>
                    <button id="mode-confidant" class="mode-btn" onclick="AILogger.setMode('whisper')">
                        <i class="fa-solid fa-heart"></i> Confidant
                    </button>
                </div>
                
                <div class="ai-chat-container">
                    <input type="text" id="ai-input" class="ai-input" placeholder="Tell me about your day..." onkeypress="if(event.key === 'Enter') window.AILogger.processText(this.value)">
                    <button type="button" class="ai-mic-btn" id="ai-mic-btn" onclick="window.AILogger.toggleMic()"><i class="fa-solid fa-microphone"></i></button>
                    <button type="button" class="ai-mic-btn" style="color:#000; background:var(--accent);" onclick="window.AILogger.processText(document.getElementById('ai-input').value)"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- HUD (Level & XP) -->
            <div class="hud-container">
                <div class="hud-top">
                    <div class="level-text">LEVEL <span id="hud-level">1</span></div>
                    <div class="xp-text" id="xp-text">0 / 1000 XP</div>
                </div>
                <div class="xp-bar-bg">
                    <div id="xp-bar-fill" class="xp-bar-fill"></div>
                </div>
            </div>

            <!-- Inventory -->
            <div class="inv-tabs">
                <button class="inv-tab active" onclick="switchTab('wearables')" id="tab-wearables">Wearables</button>
                <button class="inv-tab" onclick="switchTab('decor')" id="tab-decor">Sanctuary</button>
            </div>
            <div class="inventory-container" id="inventory"></div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="companion.js"></script>
    <script src="companion-ui.js"></script>
    <script src="juice.js"></script>
    <script src="ai-logger.js"></script>
    <script src="audio.js"></script>
    
    <script>
        function navigateToPage(page) { window.location.href = page; }
        let currentQuestLink = null;
        let currentInvTab = 'wearables';

        function gotoQuest() { if (currentQuestLink) window.location.href = currentQuestLink; }

        let petsToday = 0;
        function petCompanion() {
            const svg = document.getElementById('companion');
            svg.style.transform = 'scale(0.85) translateY(-20px)';
            setTimeout(() => { svg.style.transform = 'scale(1) translateY(0)'; }, 150);
            if (window.Juice) { Juice.playPetSound(); Juice.vibrate(30); }
        }

        function switchTab(tab) {
            currentInvTab = tab;
            document.getElementById('tab-wearables').classList.toggle('active', tab === 'wearables');
            document.getElementById('tab-decor').classList.toggle('active', tab === 'decor');
            updateDashboard(Companion.view());
        }

        function equipWearable(item) { if (item) Companion.emit({ type: 'EQUIP_WEARABLE', payload: { item: item } }); }
        function toggleDecor(item) { if (item) Companion.emit({ type: 'TOGGLE_DECOR', payload: { item: item } }); }

        function updateDashboard(view) {
            if (window.Juice) Juice.checkLevelUp(view);

            // HUD
            document.getElementById('hud-level').textContent = view.level;
            const progress = (view.xp / view.xpNeeded) * 100;
            document.getElementById('xp-bar-fill').style.width = `${progress}%`;
            document.getElementById('xp-text').textContent = `${view.xp} / ${view.xpNeeded} XP`;

            // Quest Bubble
            const bubble = document.getElementById('companion-memory');
            if (!bubble.classList.contains('is-expanded') && !bubble.innerHTML.includes('fa-spinner')) {
                if (view.quest) {
                    bubble.innerHTML = `<span>${view.quest.text}</span><span class="quest-action">👉 ${view.quest.action}</span>`;
                    currentQuestLink = view.quest.link;
                }
            }

            // Sanctuary Updates
            const sanctuary = document.getElementById('sanctuary');
            sanctuary.setAttribute('data-dominant', view.dominantStat);
            sanctuary.setAttribute('data-decor', view.equipped.decor.join(' '));
            
            // Inventory
            const invContainer = document.getElementById('inventory');
            invContainer.innerHTML = '';
            if (currentInvTab === 'wearables') {
                const items = ['halo', 'sprout', 'scarf', 'crown'];
                items.forEach(item => {
                    const hasItem = view.inventory.wearables.includes(item);
                    const isEquipped = view.equipped.wearable === item;
                    const div = document.createElement('div');
                    const icons = { halo: '😇', sprout: '🌱', scarf: '🧣', crown: '👑' };
                    div.className = `inv-item ${!hasItem ? 'empty' : ''} ${isEquipped ? 'equipped' : ''}`;
                    div.textContent = hasItem ? icons[item] : '?';
                    if (hasItem) div.onclick = () => equipWearable(isEquipped ? null : item);
                    invContainer.appendChild(div);
                });
            } else {
                const items = ['plant', 'lamp', 'rug', 'terminal'];
                items.forEach(item => {
                    const hasItem = view.inventory.decor.includes(item);
                    const isEquipped = view.equipped.decor.includes(item);
                    const div = document.createElement('div');
                    const icons = { plant: '🪴', lamp: '💡', rug: '🧶', terminal: '🖥️' };
                    div.className = `inv-item ${!hasItem ? 'empty' : ''} ${isEquipped ? 'equipped' : ''}`;
                    div.textContent = hasItem ? icons[item] : '?';
                    if (hasItem) div.onclick = () => toggleDecor(item);
                    invContainer.appendChild(div);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            AILogger.setMode('aura');
            CompanionUI.mount(document.getElementById('companion'));
            updateDashboard(Companion.view());
            window.addEventListener('companion:update', (e) => updateDashboard(e.detail));
            if (window.Juice) setTimeout(() => Juice.initParticles(), 100);
        });
    </script>
</body>
</html>
