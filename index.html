<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitverse</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="companion.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        /* New UI additions */
        .bond-container {
            width: 100%; max-width: 300px; margin: 15px auto 30px auto; text-align: center;
        }
        .bond-bar-bg {
            width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden;
            box-shadow: inset 2px 2px 4px #111, inset -2px -2px 4px #333;
        }
        .bond-bar-fill {
            height: 100%; background: #00bfff; width: 0%; transition: width 0.5s ease;
            box-shadow: 0 0 8px #00bfff;
        }
        .bond-text { font-size: 12px; color: #888; margin-top: 8px; font-family: monospace; }
        
        .quest-bubble {
            cursor: pointer; transition: transform 0.2s ease, background 0.2s ease;
            border: 1px solid #00bfff; box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
        }
        .quest-bubble:hover { transform: scale(1.02); background: rgba(0, 191, 255, 0.2); }
        .quest-action { font-size: 12px; font-weight: bold; color: #fff; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="top-buttons">
                <button type="button" class="neumorphic-button" onclick="navigateToPage('breathewell.html')"><i class="fa-solid fa-wind"></i><span>BreatheWell</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('chronozen.html')"><i class="fa-solid fa-calendar"></i><span>ChronoZen</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('dreamweaver.html')"><i class="fa-solid fa-lightbulb"></i><span>Dreamweaver</span></button>
                <button type="button" class="neumorphic-button" onclick="navigateToPage('soulsync.html')"><i class="fa-solid fa-heart"></i><span>SoulSync</span></button>
            </div>
        </header>

        <div style="display:flex; flex-direction:column; align-items:center; margin: 20px 0;">
            <!-- Memory / Quest Speech Bubble -->
            <div id="companion-memory" class="companion-memory quest-bubble" onclick="gotoQuest()">
                Hi! I'm your companion.
            </div>
            
            <!-- Neumorphic Circle Stage -->
            <div style="background:#222; border-radius:50%; padding:40px; box-shadow:inset 6px 6px 12px #111, inset -6px -6px 12px #333;">
                <svg class="companion" id="companion" onclick="petCompanion()" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="cursor: pointer; transition: transform 0.15s ease;">
                    <defs>
                        <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="var(--body-inner)"/>
                            <stop offset="100%" stop-color="var(--body-outer)"/>
                        </radialGradient>
                    </defs>
                    <g class="bob-group">
                        <ellipse class="cosmetic halo" cx="100" cy="42" rx="35" ry="10" fill="none" stroke="#ffd700" stroke-width="4" opacity="0.8" />
                        <path class="cosmetic sprout" d="M 100 58 Q 95 40 80 45 Q 95 50 100 58 Z" fill="#4ade80" />
                        <path class="cosmetic sprout" d="M 100 58 Q 105 40 120 45 Q 105 50 100 58 Z" fill="#22c55e" />
                        <path class="cosmetic scarf" d="M 50 140 Q 100 160 150 140 L 150 155 Q 100 175 50 155 Z" fill="#ef4444" />
                        <path class="cosmetic scarf" d="M 135 145 L 145 180 L 130 180 Z" fill="#dc2626" />
                        <path class="cosmetic crown" d="M 75 55 L 85 25 L 100 45 L 115 25 L 125 55 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2" stroke-linejoin="round" />
                        
                        <g class="breath-group">
                            <path class="body" d="M 100 175 C 35 175, 25 110, 45 70 C 65 35, 135 35, 155 70 C 175 110, 165 175, 100 175 Z" fill="url(#bodyGrad)"/>
                            <g class="face">
                                <ellipse class="eye" cx="80" cy="105" rx="7" ry="10" fill="#1a1a2e"/>
                                <ellipse class="eye" cx="120" cy="105" rx="7" ry="10" fill="#1a1a2e"/>
                                <circle cx="78" cy="102" r="2.5" fill="#fff" opacity="0.8"/>
                                <circle cx="118" cy="102" r="2.5" fill="#fff" opacity="0.8"/>
                                <path class="mouth mouth-radiant" d="M 82 128 Q 100 145 118 128" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-content" d="M 85 130 Q 100 138 115 130" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-settled" d="M 88 132 L 112 132" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-quiet" d="M 88 133 Q 100 131 112 133" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                                <path class="mouth mouth-low" d="M 85 137 Q 100 127 115 137" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
                            </g>
                            <g class="cheeks">
                                <circle cx="66" cy="120" r="7" fill="#ff8fb8" opacity="0.6"/>
                                <circle cx="134" cy="120" r="7" fill="#ff8fb8" opacity="0.6"/>
                            </g>
                        </g>
                    </g>
                </svg>
            </div>

            <!-- NEW: Bond Progress Bar -->
            <div class="bond-container">
                <div class="bond-bar-bg">
                    <div id="bond-bar-fill" class="bond-bar-fill"></div>
                </div>
                <div id="bond-text" class="bond-text">Level 1 · Bond 0</div>
            </div>
        </div>

        <div style="text-align:center; margin-bottom: 30px;">
            <p style="font-size:12px; color:#888; margin-bottom:12px; font-family:monospace; letter-spacing:1px;">QUICK LOG</p>
            <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                <button type="button" class="neumorphic-button" onclick="emit('MOOD_CHECKIN', {value: 5})">😄 Great</button>
                <button type="button" class="neumorphic-button" onclick="emit('MOOD_CHECKIN', {value: 3})">😐 Okay</button>
                <button type="button" class="neumorphic-button" onclick="emit('MOOD_CHECKIN', {value: 1})">😔 Low</button>
            </div>
        </div>

        <footer>
            <button type="button" class="footer-button wellbeing" onclick="showChildButtons('wellbeing')" aria-expanded="true">WellBeing</button>
            <button type="button" class="footer-button productivity" onclick="showChildButtons('productivity')" aria-expanded="false">Productivity</button>
            <button type="button" class="footer-button connections" onclick="showChildButtons('connections')" aria-expanded="false">Connections</button>
            <button type="button" class="footer-button relaxation" onclick="showChildButtons('relaxation')" aria-expanded="false">Relaxation</button>
        </footer>
    </div>

    <script src="companion.js"></script>
    <script src="companion-ui.js"></script>
    <script>
        function navigateToPage(page) { window.location.href = page; }
        
        // Use this to store the current quest link
        let currentQuestLink = null;

        function showChildButtons(category) {
            document.querySelectorAll('.child-buttons').forEach(div => {
                div.style.display = 'none'; div.classList.remove('active');
            });
            const target = document.getElementById(category);
            if (target) { target.style.display = 'flex'; target.classList.add('active'); }
            document.querySelectorAll('.footer-button').forEach(btn => btn.setAttribute('aria-expanded', 'false'));
            const trigger = document.querySelector(`.footer-button.${category}`);
            if (trigger) trigger.setAttribute('aria-expanded', 'true');
        }

        const uuid = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
        function emit(type, payload) { Companion.emit({ id: uuid(), type, payload }); }

        function gotoQuest() {
            if (currentQuestLink) window.location.href = currentQuestLink;
        }

        let petsToday = 0;
        function petCompanion() {
            const svg = document.getElementById('companion');
            svg.style.transform = 'scale(0.9) translateY(-20px)';
            setTimeout(() => { svg.style.transform = 'scale(1) translateY(0)'; }, 150);
            if (petsToday < 3) {
                Companion.emit({ id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(), type: 'MOOD_CHECKIN', payload: { value: 5 } });
                petsToday++;
            }
        }

        // Update the UI to reflect the Bond and Quest
        function updateDashboard(view) {
            // 1. Update Bond Bar
            const level = view.level;
            const bond = view.bond;
            // Formula: level = floor(sqrt(bond/5)). So next level starts at (level+1)^2 * 5.
            const currentLevelBase = Math.pow(level, 2) * 5;
            const nextLevelBase = Math.pow(level + 1, 2) * 5;
            const progress = ((bond - currentLevelBase) / (nextLevelBase - currentLevelBase)) * 100;
            
            document.getElementById('bond-bar-fill').style.width = `${Math.min(100, progress)}%`;
            document.getElementById('bond-text').textContent = `Level ${level} · ${bond} Bond`;

            // 2. Update Quest Bubble
            const bubble = document.getElementById('companion-memory');
            if (view.quest) {
                bubble.innerHTML = `${view.quest.text}<br><span class="quest-action">👉 Go to ${view.quest.action}</span>`;
                currentQuestLink = view.quest.link;
            } else if (view.memory) {
                bubble.textContent = view.memory;
                currentQuestLink = null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            showChildButtons('wellbeing');
            CompanionUI.mount(document.getElementById('companion'));
            
            // Initial update and subscribe to changes
            updateDashboard(Companion.view());
            window.addEventListener('companion:update', (e) => updateDashboard(e.detail));
        });
    </script>
</body>
</html>
