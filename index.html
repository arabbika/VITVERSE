            <!-- AI Chat Bar with Mode Toggles -->
            <div class="ai-chat-wrapper">
                <div class="mode-toggles">
                    <button id="mode-tactician" class="mode-btn active" onclick="AILogger.setMode('aura')"><i class="fa-solid fa-shield-halved"></i> Tactician</button>
                    <button id="mode-confidant" class="mode-btn" onclick="AILogger.setMode('whisper')"><i class="fa-solid fa-heart"></i> Confidant</button>
                </div>
                
                <div class="ai-chat-container">
                    <input type="text" id="ai-input" class="ai-input" placeholder="e.g. Slept 8 hours, feeling great..." onkeypress="if(event.key === 'Enter') window.AILogger.processText(this.value)">
                    <button type="button" class="ai-mic-btn" id="ai-mic-btn" onclick="window.AILogger.toggleMic()"><i class="fa-solid fa-microphone"></i></button>
                    <button type="button" class="ai-mic-btn" style="color:#000; background:var(--accent);" onclick="window.AILogger.processText(document.getElementById('ai-input').value)"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- Audio Toggle (Put this near the top of the sanctuary) -->
            <button id="audio-btn" class="audio-toggle-btn" onclick="SanctuaryAudio.toggle(Companion.view().dominantStat)">
                <i class="fa-solid fa-volume-high"></i>
            </button>
