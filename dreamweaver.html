<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dreamweaver — Vitverse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f111a">
    <script src="companion.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then((registration) => {
                registration.onupdatefound = () => {
                    const installingWorker = registration.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    };
                };
            }).catch((error) => console.error('SW registration failed:', error));
        }
    </script>
    <style>
        body { background: #0f111a; }
        .logo-link { display: inline-block; margin-top: 20px; margin-bottom: 20px; cursor: pointer; transition: transform 0.2s ease; }
        .logo-link:active { transform: scale(0.95); }
        .logo-image { width: 160px; height: auto; display: block; }
        
        .dream-card {
            background: var(--bg-surface); border: 1px solid var(--border-glass);
            border-radius: 24px; padding: 30px; width: 100%; max-width: 400px;
            backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center; margin-bottom: 20px;
        }
        h2 { color: var(--accent); margin-top: 0; font-size: 20px; font-family: var(--font-display); letter-spacing: 1px;}
        .hours-display { font-size: 48px; color: #fff; margin: 20px 0; font-weight: bold; font-family: var(--font-display); }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-bottom: 30px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px var(--accent-glow); margin-top: -8px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: rgba(0,0,0,0.4); border-radius: 4px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        
        .quality-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .q-btn {
            background: rgba(0,0,0,0.3); border: 1px solid transparent; border-radius: 50%; width: 50px; height: 50px;
            font-size: 24px; cursor: pointer; transition: all 0.2s ease; opacity: 0.5;
        }
        .q-btn.selected { opacity: 1; border-color: var(--accent); background: rgba(0, 229, 255, 0.1); transform: scale(1.1); box-shadow: 0 0 15px var(--accent-glow); }
        
        .save-btn {
            background: var(--accent); color: #000; border: none; padding: 15px 40px; border-radius: 16px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;
            box-shadow: 0 0 15px var(--accent-glow); transition: transform 0.2s ease;
        }
        .save-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="wrapper" style="align-items: center;">
        <a href="index.html" class="logo-link"><img src="logo.png" alt="VITVERSE" class="logo-image"></a>
        
        <div class="dream-card">
            <h2>🌙 Dreamweaver</h2>
            <p style="color: var(--text-muted); font-size: 14px;">How long did you sleep?</p>
            
            <div class="hours-display" id="hours-display">7.5h</div>
            <input type="range" id="sleep-slider" min="3" max="12" step="0.5" value="7.5">
            
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 20px;">Sleep Quality</p>
            <div class="quality-group" id="quality-group">
                <button type="button" class="q-btn" data-q="1">😫</button>
                <button type="button" class="q-btn" data-q="2">😕</button>
                <button type="button" class="q-btn" data-q="3">😐</button>
                <button type="button" class="q-btn" data-q="4">🙂</button>
                <button type="button" class="q-btn" data-q="5">😴</button>
            </div>
            
            <button type="button" class="save-btn" onclick="saveSleep()">Log Sleep</button>
        </div>
    </div>

    <script>
        let selectedQuality = 4;
        const slider = document.getElementById('sleep-slider');
        const display = document.getElementById('hours-display');
        const qButtons = document.querySelectorAll('.q-btn');

        slider.addEventListener('input', (e) => display.textContent = e.target.value + 'h');

        qButtons.forEach(btn => {
            if (btn.dataset.q == selectedQuality) btn.classList.add('selected');
            btn.addEventListener('click', () => {
                qButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedQuality = parseInt(btn.dataset.q);
            });
        });

        function saveSleep() {
            const hours = parseFloat(slider.value);
            if (window.Companion) {
                Companion.emit({
                    id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                    type: 'SLEEP_LOGGED',
                    payload: { hours: hours, quality: selectedQuality }
                });
            }
            const btn = document.querySelector('.save-btn');
            btn.textContent = 'Saved! Returning...';
            btn.style.background = '#4ade80';
            setTimeout(() => window.location.href = 'index.html', 1000);
        }
    </script>
</body>
</html>
