<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoZen — Vitverse</title>

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
          integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- App styles -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- FullCalendar v6 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <!-- Companion engine -->
    <script src="companion.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(r => console.log('SW registered:', r.scope))
                .catch(e => console.error('SW registration failed:', e));
        }
    </script>

    <style>
        /* ---------- Logo Link ---------- */
        .logo-link {
            display: inline-block;
            margin-top: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .logo-link:active {
            transform: scale(0.95);
        }
        .logo-image {
            width: 160px; /* Adjusted to match BreatheWell */
            height: auto;
            display: block;
        }

        /* ---------- child-button default state ---------- */
        .child-buttons:not(.active) { display: none; }
        .child-buttons.active        { display: flex; }

        /* ---------- calendar ---------- */
        .calendar-container {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
        }
        #calendar {
            background: #2c2c2c;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 5px 5px 10px #1a1a1a, -5px -5px 10px #444;
            /* Dark mode overrides for FullCalendar */
            --fc-border-color: #333;
            --fc-daygrid-event-dot-width: 8px;
            color: #e0e0e0;
        }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #333; }
        .fc-col-header-cell-cushion, .fc-daygrid-day-number { color: #e0e0e0; text-decoration: none; }

        /* ---------- event delete icon ---------- */
        .event-delete-icon {
            position: absolute;
            top: 2px;
            right: 6px;
            color: #f88;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            font-weight: bold;
            z-index: 2;
            user-select: none;
        }
        .event-delete-icon:hover { color: #f44; }

        /* ---------- focus visibility ---------- */
        .neumorphic-button:focus-visible,
        .footer-button:focus-visible {
            outline: 2px solid #00bfff;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <header>
            <!-- Updated Logo wrapped in a link back to the hub -->
            <a href="index.html" class="logo-link" aria-label="Back to Vitverse home">
                <img src="logo.png" alt="VITVERSE" class="logo-image">
            </a>

            <div class="top-buttons">
                <button type="button" class="neumorphic-button breathewell"
                        onclick="navigateToPage('breathewell.html')" id="breathewell-btn">
                    <i class="fa-solid fa-wind"></i>
                    <span>BreatheWell</span>
                </button>
                <button type="button" class="neumorphic-button chronozen active"
                        onclick="navigateToPage('chronozen.html')" id="chronozen-btn">
                    <i class="fa-solid fa-calendar"></i>
                    <span>ChronoZen</span>
                </button>
                <button type="button" class="neumorphic-button dreamweaver"
                        onclick="navigateToPage('dreamweaver.html')" id="dreamweaver-btn">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span>Dreamweaver</span>
                </button>
                <button type="button" class="neumorphic-button soulsync"
                        onclick="navigateToPage('soulsync.html')" id="soulsync-btn">
                    <i class="fa-solid fa-heart"></i>
                    <span>SoulSync</span>
                </button>
            </div>
        </header>

        <div class="container">
            <div id="wellbeing" class="child-buttons wellbeing active">
                <button type="button" class="neumorphic-button" id="skills-btn">
                    <i class="fa-solid fa-dumbbell"></i><span>Skills</span>
                </button>
                <button type="button" class="neumorphic-button" id="mindfulness-btn">
                    <i class="fa-solid fa-brain"></i><span>Mindfulness</span>
                </button>
                <button type="button" class="neumorphic-button" id="reflection-btn">
                    <i class="fa-solid fa-book"></i><span>Reflection</span>
                </button>
                <button type="button" class="neumorphic-button" id="moods-btn">
                    <i class="fa-solid fa-smile"></i><span>Moods</span>
                </button>
                <button type="button" class="neumorphic-button" id="exercise-btn">
                    <i class="fa-solid fa-running"></i><span>Exercise</span>
                </button>
                <button type="button" class="neumorphic-button" id="nutrition-btn">
                    <i class="fa-solid fa-utensils"></i><span>Nutrition</span>
                </button>
                <button type="button" class="neumorphic-button" id="sleep-btn">
                    <i class="fa-solid fa-bed"></i><span>Sleep</span>
                </button>
                <button type="button" class="neumorphic-button" id="financial-btn">
                    <i class="fa-solid fa-dollar-sign"></i><span>Financial</span>
                </button>
            </div>

            <div id="productivity" class="child-buttons productivity">
                <button type="button" class="neumorphic-button" id="tasks-btn">
                    <i class="fa-solid fa-list"></i><span>Tasks</span>
                </button>
            </div>

            <div id="connections" class="child-buttons connections">
                <button type="button" class="neumorphic-button" id="interaction-btn">
                    <i class="fa-solid fa-handshake"></i><span>Interaction</span>
                </button>
                <button type="button" class="neumorphic-button" id="communication-btn">
                    <i class="fa-solid fa-comments"></i><span>Communication</span>
                </button>
            </div>

            <div id="relaxation" class="child-buttons relaxation">
                <button type="button" class="neumorphic-button" id="games-btn">
                    <i class="fa-solid fa-gamepad"></i><span>Games</span>
                </button>
                <button type="button" class="neumorphic-button" id="music-btn">
                    <i class="fa-solid fa-music"></i><span>Music</span>
                </button>
            </div>
        </div>

        <div class="calendar-container">
            <div id="calendar"></div>
        </div>

        <footer>
            <button type="button" class="footer-button wellbeing"
                    onclick="showChildButtons('wellbeing')"
                    aria-expanded="true" aria-controls="wellbeing">
                WellBeing
            </button>
            <button type="button" class="footer-button productivity"
                    onclick="showChildButtons('productivity')"
                    aria-expanded="false" aria-controls="productivity">
                Productivity
            </button>
            <button type="button" class="footer-button connections"
                    onclick="showChildButtons('connections')"
                    aria-expanded="false" aria-controls="connections">
                Connections
            </button>
            <button type="button" class="footer-button relaxation"
                    onclick="showChildButtons('relaxation')"
                    aria-expanded="false" aria-controls="relaxation">
                Relaxation
            </button>
        </footer>
    </div>

    <script>
        // ---------- navigation ----------
        function navigateToPage(page) {
            window.location.href = page;
        }

        // ---------- child button toggling ----------
        function showChildButtons(category) {
            document.querySelectorAll('.child-buttons').forEach(div => {
                div.style.display = 'none';
                div.classList.remove('active');
            });

            const target = document.getElementById(category);
            if (!target) return;

            target.style.display = 'flex';
            target.classList.add('active');

            document.querySelectorAll('.footer-button').forEach(btn => {
                btn.setAttribute('aria-expanded', 'false');
            });
            const trigger = document.querySelector(`.footer-button.${category}`);
            if (trigger) trigger.setAttribute('aria-expanded', 'true');
        }

        // ---------- calendar persistence ----------
        const STORAGE_KEY = 'chronozen.events.v1';

        function loadEvents() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch {
                return [];
            }
        }

        function saveEvents(calendar) {
            if (!calendar) return;
            try {
                const events = calendar.getEvents().map(e => ({
                    id: e.id,
                    title: e.title,
                    start: e.startStr,
                    end: e.endStr,
                    allDay: e.allDay,
                }));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
            } catch (err) {
                console.warn('Failed to save events:', err);
            }
        }

        // ---------- init ----------
        document.addEventListener('DOMContentLoaded', function () {
            // Default child-button state
            document.querySelectorAll('.child-buttons').forEach(div => {
                div.style.display = 'none';
                div.classList.remove('active');
            });
            showChildButtons('wellbeing');

            const calendarEl = document.getElementById('calendar');
            if (!calendarEl || typeof FullCalendar === 'undefined') {
                console.error('FullCalendar not loaded or #calendar missing');
                return;
            }

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                editable: true,
                droppable: true,
                events: loadEvents(),

                eventReceive: function (info) {
                    info.event.setProp(
                        'title',
                        info.draggedEl.getAttribute('data-event-title') || 'Task'
                    );
                    saveEvents(calendar);

                    if (window.Companion) {
                        Companion.emit({
                            id: (window.crypto?.randomUUID?.() ??
                                 (Date.now() + '-' + Math.random().toString(36).slice(2))),
                            type: 'TASK_COMPLETE',
                        });
                    }
                },

                eventDrop:   function () { saveEvents(calendar); },
                eventRemove: function () { saveEvents(calendar); },

                eventDidMount: function (info) {
                    const del = document.createElement('span');
                    del.textContent = '\u00D7';
                    del.className = 'event-delete-icon';
                    del.setAttribute('role', 'button');
                    del.setAttribute('aria-label', 'Delete event');
                    del.addEventListener('click', function (e) {
                        e.stopPropagation();
                        e.preventDefault();
                        if (confirm('Delete this event?')) {
                            info.event.remove();   // fires eventRemove → saveEvents
                        }
                    });

                    const pos = window.getComputedStyle(info.el).position;
                    if (pos === 'static') info.el.style.position = 'relative';
                    info.el.appendChild(del);
                },
            });

            calendar.render();

            // Only child buttons inside .container are draggable
            document.querySelectorAll('.container .neumorphic-button').forEach(function (elem) {
                const span = elem.querySelector('span');
                const title = span ? span.textContent.trim() : 'Task';
                elem.setAttribute('data-event-title', title);

                new FullCalendar.Draggable(elem, {
                    itemSelector: '.neumorphic-button',
                    eventData: function () {
                        return { title: title };
                    },
                });
            });
        });
    </script>
</body>
</html>
